name: Release

# Bump "version" in komari-theme.json and push to main -> tag v<version> + GitHub Release with the theme ZIP.
on:
  push:
    branches:
      - main
    paths:
      - komari-theme.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Read version
        id: meta
        run: echo "tag=v$(node -p "require('./komari-theme.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build theme package
        if: steps.check.outputs.exists == 'false'
        run: bash build-theme.sh

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release create "$TAG" ./*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
